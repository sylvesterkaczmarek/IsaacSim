name: Apply IMU world-frame acceleration fix

on:
  push:
    branches:
      - fix/imu-world-frame-acceleration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/imu-world-frame-acceleration

      - name: Apply focused IMU patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          experimental = Path(
              'source/extensions/isaacsim.sensors.experimental.physics/plugins/'
              'isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp'
          )
          replace_once(
              experimental,
              '''        omni::math::linalg::vec3d vB = rWb.TransformDir(vW);\n        omni::math::linalg::vec3d wB = rWb.TransformDir(wW);\n''',
              '''        omni::math::linalg::vec3d wB = rWb.TransformDir(wW);\n''',
          )
          replace_once(
              experimental,
              '''        raw.linearVelocityX = static_cast<float>(vB[0]);\n        raw.linearVelocityY = static_cast<float>(vB[1]);\n        raw.linearVelocityZ = static_cast<float>(vB[2]);\n''',
              '''        // Keep linear velocity in the inertial world frame. Differencing body-frame\n        // components would introduce a spurious transport term whenever the body rotates.\n        raw.linearVelocityX = static_cast<float>(vW[0]);\n        raw.linearVelocityY = static_cast<float>(vW[1]);\n        raw.linearVelocityZ = static_cast<float>(vW[2]);\n''',
          )
          replace_once(
              experimental,
              '''        reading.linearAccelerationX = sumX / sensor.linearAccelerationFilterSize;\n        reading.linearAccelerationY = sumY / sensor.linearAccelerationFilterSize;\n        reading.linearAccelerationZ = sumZ / sensor.linearAccelerationFilterSize;\n''',
              '''        const omni::math::linalg::vec3d linearAccelerationW(\n            sumX / sensor.linearAccelerationFilterSize, sumY / sensor.linearAccelerationFilterSize,\n            sumZ / sensor.linearAccelerationFilterSize);\n        const omni::math::linalg::vec3d linearAccelerationB = rWb.TransformDir(linearAccelerationW);\n        reading.linearAccelerationX = static_cast<float>(linearAccelerationB[0]);\n        reading.linearAccelerationY = static_cast<float>(linearAccelerationB[1]);\n        reading.linearAccelerationZ = static_cast<float>(linearAccelerationB[2]);\n''',
          )

          deprecated = Path(
              'source/deprecated/isaacsim.sensors.physics/plugins/'
              'isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp'
          )
          replace_once(
              deprecated,
              '''        omni::math::linalg::vec3d vB = rWb.TransformDir(vW);\n        omni::math::linalg::vec3d wB = rWb.TransformDir(wW);\n''',
              '''        omni::math::linalg::vec3d wB = rWb.TransformDir(wW);\n''',
          )
          replace_once(
              deprecated,
              '''        m_rawBuffer[0].linVelX = static_cast<float>(vB[0]);\n        m_rawBuffer[0].linVelY = static_cast<float>(vB[1]);\n        m_rawBuffer[0].linVelZ = static_cast<float>(vB[2]);\n''',
              '''        // Keep linear velocity in the inertial world frame so rotation of the body\n        // cannot create an apparent acceleration during finite differencing.\n        m_rawBuffer[0].linVelX = static_cast<float>(vW[0]);\n        m_rawBuffer[0].linVelY = static_cast<float>(vW[1]);\n        m_rawBuffer[0].linVelZ = static_cast<float>(vW[2]);\n''',
          )
          replace_once(
              deprecated,
              '''        m_sensorReadings[0].linAccX = static_cast<float>(tmpSumX / m_linearAccelerationFilterSize);\n        m_sensorReadings[0].linAccY = static_cast<float>(tmpSumY / m_linearAccelerationFilterSize);\n        m_sensorReadings[0].linAccZ = static_cast<float>(tmpSumZ / m_linearAccelerationFilterSize);\n''',
              '''        const omni::math::linalg::vec3d linearAccelerationW(\n            tmpSumX / m_linearAccelerationFilterSize, tmpSumY / m_linearAccelerationFilterSize,\n            tmpSumZ / m_linearAccelerationFilterSize);\n        const omni::math::linalg::vec3d linearAccelerationB = rWb.TransformDir(linearAccelerationW);\n        m_sensorReadings[0].linAccX = static_cast<float>(linearAccelerationB[0]);\n        m_sensorReadings[0].linAccY = static_cast<float>(linearAccelerationB[1]);\n        m_sensorReadings[0].linAccZ = static_cast<float>(linearAccelerationB[2]);\n''',
          )
          PY

      - name: Validate diff
        shell: bash
        run: |
          python -m py_compile source/extensions/isaacsim.sensors.experimental.physics/python/tests/test_imu_rotating_frame.py
          git diff --check
          grep -q 'raw.linearVelocityX = static_cast<float>(vW\[0\])' \
            source/extensions/isaacsim.sensors.experimental.physics/plugins/isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp
          grep -q 'm_rawBuffer\[0\].linVelX = static_cast<float>(vW\[0\])' \
            source/deprecated/isaacsim.sensors.physics/plugins/isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            source/extensions/isaacsim.sensors.experimental.physics/plugins/isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp \
            source/deprecated/isaacsim.sensors.physics/plugins/isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp
          git diff --cached --check
          git commit -m 'Differentiate IMU linear velocity in world frame'
          git push origin HEAD:fix/imu-world-frame-acceleration
