name: Apply IMU world-frame acceleration fix

on:
  push:
    branches:
      - fix/imu-world-frame-acceleration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/imu-world-frame-acceleration

      - name: Apply focused IMU patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub(path: Path, pattern: str, replacement: str, count: int = 1) -> None:
              text = path.read_text()
              updated, matches = re.subn(pattern, replacement, text, count=count, flags=re.MULTILINE)
              if matches != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {matches} for {pattern!r}")
              path.write_text(updated)

          experimental = Path(
              'source/extensions/isaacsim.sensors.experimental.physics/plugins/'
              'isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp'
          )
          sub(experimental, r'^\s*omni::math::linalg::vec3d vB = rWb\.TransformDir\(vW\);\n', '')
          sub(
              experimental,
              r'^(\s*)raw\.linearVelocityX = static_cast<float>\(vB\[0\]\);\n\1raw\.linearVelocityY = static_cast<float>\(vB\[1\]\);\n\1raw\.linearVelocityZ = static_cast<float>\(vB\[2\]\);',
              r'''\1// Keep linear velocity in the inertial world frame. Differencing body-frame
\1// components would introduce a spurious transport term whenever the body rotates.
\1raw.linearVelocityX = static_cast<float>(vW[0]);
\1raw.linearVelocityY = static_cast<float>(vW[1]);
\1raw.linearVelocityZ = static_cast<float>(vW[2]);''',
          )
          sub(
              experimental,
              r'^(\s*)reading\.linearAccelerationX = sumX / sensor\.linearAccelerationFilterSize;\n\1reading\.linearAccelerationY = sumY / sensor\.linearAccelerationFilterSize;\n\1reading\.linearAccelerationZ = sumZ / sensor\.linearAccelerationFilterSize;',
              r'''\1const omni::math::linalg::vec3d linearAccelerationW(
\1    sumX / sensor.linearAccelerationFilterSize, sumY / sensor.linearAccelerationFilterSize,
\1    sumZ / sensor.linearAccelerationFilterSize);
\1const omni::math::linalg::vec3d linearAccelerationB = rWb.TransformDir(linearAccelerationW);
\1reading.linearAccelerationX = static_cast<float>(linearAccelerationB[0]);
\1reading.linearAccelerationY = static_cast<float>(linearAccelerationB[1]);
\1reading.linearAccelerationZ = static_cast<float>(linearAccelerationB[2]);''',
          )

          deprecated = Path(
              'source/deprecated/isaacsim.sensors.physics/plugins/'
              'isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp'
          )
          sub(
              deprecated,
              r'^\s*// velocity of sensor frame in sensor frame\n\s*omni::math::linalg::vec3d vB = rWb\.TransformDir\(vW\);\n\n',
              '    // Linear velocity stays in the inertial world frame until after differentiation.\n\n',
          )
          sub(
              deprecated,
              r'^\s*// we then finite diff vB to get a_b, to reduce noise, average multiple finite diffs$',
              '    // finite difference world-frame velocity, then rotate acceleration to the sensor frame',
          )
          sub(
              deprecated,
              r'^(\s*)m_rawBuffer\[0\]\.linVelX = static_cast<float>\(vB\[0\]\);\n\1m_rawBuffer\[0\]\.linVelY = static_cast<float>\(vB\[1\]\);\n\1m_rawBuffer\[0\]\.linVelZ = static_cast<float>\(vB\[2\]\);',
              r'''\1m_rawBuffer[0].linVelX = static_cast<float>(vW[0]);
\1m_rawBuffer[0].linVelY = static_cast<float>(vW[1]);
\1m_rawBuffer[0].linVelZ = static_cast<float>(vW[2]);''',
          )
          sub(
              deprecated,
              r'^(\s*)// average acc\n\1m_sensorReadings\[0\]\.linAccX = static_cast<float>\(tmpSumX / m_linearAccelerationFilterSize\);\n\1m_sensorReadings\[0\]\.linAccY = static_cast<float>\(tmpSumY / m_linearAccelerationFilterSize\);\n\1m_sensorReadings\[0\]\.linAccZ = static_cast<float>\(tmpSumZ / m_linearAccelerationFilterSize\);',
              r'''\1// Average in world coordinates and rotate the result into the current sensor frame.
\1const omni::math::linalg::vec3d linearAccelerationW(
\1    tmpSumX / m_linearAccelerationFilterSize, tmpSumY / m_linearAccelerationFilterSize,
\1    tmpSumZ / m_linearAccelerationFilterSize);
\1const omni::math::linalg::vec3d linearAccelerationB = rWb.TransformDir(linearAccelerationW);
\1m_sensorReadings[0].linAccX = static_cast<float>(linearAccelerationB[0]);
\1m_sensorReadings[0].linAccY = static_cast<float>(linearAccelerationB[1]);
\1m_sensorReadings[0].linAccZ = static_cast<float>(linearAccelerationB[2]);''',
          )
          PY

      - name: Validate diff
        shell: bash
        run: |
          python -m py_compile source/extensions/isaacsim.sensors.experimental.physics/python/tests/test_imu_rotating_frame.py
          git diff --check
          grep -q 'raw.linearVelocityX = static_cast<float>(vW\[0\])' \
            source/extensions/isaacsim.sensors.experimental.physics/plugins/isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp
          grep -q 'm_rawBuffer\[0\].linVelX = static_cast<float>(vW\[0\])' \
            source/deprecated/isaacsim.sensors.physics/plugins/isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            source/extensions/isaacsim.sensors.experimental.physics/plugins/isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp \
            source/deprecated/isaacsim.sensors.physics/plugins/isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp
          git diff --cached --check
          git commit -m 'Differentiate IMU linear velocity in world frame'
          git push origin HEAD:fix/imu-world-frame-acceleration
