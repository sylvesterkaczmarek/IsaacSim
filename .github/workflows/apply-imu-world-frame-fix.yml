name: Apply IMU world-frame acceleration fix

on:
  push:
    branches:
      - fix/imu-world-frame-acceleration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/imu-world-frame-acceleration

      - name: Apply focused IMU patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count} for {old!r}")
              path.write_text(text.replace(old, new, 1))

          experimental = Path(
              'source/extensions/isaacsim.sensors.experimental.physics/plugins/'
              'isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp'
          )
          replace_once(
              experimental,
              '    omni::math::linalg::vec3d vB = rWb.TransformDir(vW);\n',
              '',
          )
          replace_once(
              experimental,
              '''    raw.linearVelocityX = static_cast<float>(vB[0]);
    raw.linearVelocityY = static_cast<float>(vB[1]);
    raw.linearVelocityZ = static_cast<float>(vB[2]);
''',
              '''    // Keep linear velocity in the inertial world frame. Differencing body-frame
    // components would introduce a spurious transport term whenever the body rotates.
    raw.linearVelocityX = static_cast<float>(vW[0]);
    raw.linearVelocityY = static_cast<float>(vW[1]);
    raw.linearVelocityZ = static_cast<float>(vW[2]);
''',
          )
          replace_once(
              experimental,
              '''    reading.linearAccelerationX = sumX / sensor.linearAccelerationFilterSize;
    reading.linearAccelerationY = sumY / sensor.linearAccelerationFilterSize;
    reading.linearAccelerationZ = sumZ / sensor.linearAccelerationFilterSize;
''',
              '''    const omni::math::linalg::vec3d linearAccelerationW(
        sumX / sensor.linearAccelerationFilterSize, sumY / sensor.linearAccelerationFilterSize,
        sumZ / sensor.linearAccelerationFilterSize);
    const omni::math::linalg::vec3d linearAccelerationB = rWb.TransformDir(linearAccelerationW);
    reading.linearAccelerationX = static_cast<float>(linearAccelerationB[0]);
    reading.linearAccelerationY = static_cast<float>(linearAccelerationB[1]);
    reading.linearAccelerationZ = static_cast<float>(linearAccelerationB[2]);
''',
          )

          deprecated = Path(
              'source/deprecated/isaacsim.sensors.physics/plugins/'
              'isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp'
          )
          replace_once(
              deprecated,
              '''    // velocity of sensor frame in sensor frame
    omni::math::linalg::vec3d vB = rWb.TransformDir(vW);

''',
              '''    // Linear velocity stays in the inertial world frame until after differentiation.
''',
          )
          replace_once(
              deprecated,
              '    // we then finite diff vB to get a_b, to reduce noise, average multiple finite diffs\n',
              '    // finite difference world-frame velocity, then rotate acceleration to the sensor frame\n',
          )
          replace_once(
              deprecated,
              '''    m_rawBuffer[0].linVelX = static_cast<float>(vB[0]);
    m_rawBuffer[0].linVelY = static_cast<float>(vB[1]);
    m_rawBuffer[0].linVelZ = static_cast<float>(vB[2]);
''',
              '''    m_rawBuffer[0].linVelX = static_cast<float>(vW[0]);
    m_rawBuffer[0].linVelY = static_cast<float>(vW[1]);
    m_rawBuffer[0].linVelZ = static_cast<float>(vW[2]);
''',
          )
          replace_once(
              deprecated,
              '''    // average acc
    m_sensorReadings[0].linAccX = static_cast<float>(tmpSumX / m_linearAccelerationFilterSize);
    m_sensorReadings[0].linAccY = static_cast<float>(tmpSumY / m_linearAccelerationFilterSize);
    m_sensorReadings[0].linAccZ = static_cast<float>(tmpSumZ / m_linearAccelerationFilterSize);
''',
              '''    // Average in world coordinates and rotate the result into the current sensor frame.
    const omni::math::linalg::vec3d linearAccelerationW(
        tmpSumX / m_linearAccelerationFilterSize, tmpSumY / m_linearAccelerationFilterSize,
        tmpSumZ / m_linearAccelerationFilterSize);
    const omni::math::linalg::vec3d linearAccelerationB = rWb.TransformDir(linearAccelerationW);
    m_sensorReadings[0].linAccX = static_cast<float>(linearAccelerationB[0]);
    m_sensorReadings[0].linAccY = static_cast<float>(linearAccelerationB[1]);
    m_sensorReadings[0].linAccZ = static_cast<float>(linearAccelerationB[2]);
''',
          )
          PY

      - name: Validate diff
        shell: bash
        run: |
          python -m py_compile source/extensions/isaacsim.sensors.experimental.physics/python/tests/test_imu_rotating_frame.py
          git diff --check
          grep -q 'raw.linearVelocityX = static_cast<float>(vW\[0\])' \
            source/extensions/isaacsim.sensors.experimental.physics/plugins/isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp
          grep -q 'm_rawBuffer\[0\].linVelX = static_cast<float>(vW\[0\])' \
            source/deprecated/isaacsim.sensors.physics/plugins/isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            source/extensions/isaacsim.sensors.experimental.physics/plugins/isaacsim.sensors.experimental.physics/ImuSensorImpl.cpp \
            source/deprecated/isaacsim.sensors.physics/plugins/isaacsim.sensors.physics/imu_sensor/ImuSensor.cpp
          git diff --cached --check
          git commit -m 'Differentiate IMU linear velocity in world frame'
          git push origin HEAD:fix/imu-world-frame-acceleration
