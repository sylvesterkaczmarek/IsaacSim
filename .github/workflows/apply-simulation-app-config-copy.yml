name: Apply SimulationApp config copy fix

on:
  push:
    branches:
      - fix/simulation-app-config-copy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simulation-app-config-copy

      - name: Copy launcher defaults per instance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('source/extensions/isaacsim.simulation_app/isaacsim/simulation_app/simulation_app.py')
          text = path.read_text()
          old = '        self.config = self.DEFAULT_LAUNCHER_CONFIG\n'
          new = '        self.config = self.DEFAULT_LAUNCHER_CONFIG.copy()\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one config assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile source/extensions/isaacsim.simulation_app/isaacsim/simulation_app/simulation_app.py
          git diff --check
          grep -q 'self.config = self.DEFAULT_LAUNCHER_CONFIG.copy()' \
            source/extensions/isaacsim.simulation_app/isaacsim/simulation_app/simulation_app.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/extensions/isaacsim.simulation_app/isaacsim/simulation_app/simulation_app.py
          git commit -m 'Copy SimulationApp launcher defaults per instance'
          git push origin HEAD:fix/simulation-app-config-copy
