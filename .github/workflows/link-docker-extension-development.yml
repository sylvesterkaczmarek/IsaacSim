name: Link Docker extension development guide

on:
  push:
    branches:
      - docs/docker-extension-hot-reload

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/docker-extension-hot-reload
      - name: Add README links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/docker/README.md')
          text = path.read_text()

          toc_marker = '- [Environment Variables for `docker run`](#environment-variables-for-docker-run)\n'
          toc_insert = toc_marker + '- [Developing extensions with hot reload](#developing-extensions-with-hot-reload)\n'
          if text.count(toc_marker) != 1:
              raise SystemExit('TOC marker did not match exactly once')
          text = text.replace(toc_marker, toc_insert, 1)

          marker = '''Alternatively, use the provided helper script which drops into a bash shell inside the container:\n\n```bash\n./tools/docker/run_docker.sh\n```\n'''
          replacement = marker + '''\n### Developing extensions with hot reload\n\nFor a bind-mounted extension development workflow with Kit filesystem watching and hot reload, see [Developing extensions in Docker](extension_development.md).\n'''
          if text.count(marker) != 1:
              raise SystemExit('run_docker marker did not match exactly once')
          path.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -q 'extension_development.md' tools/docker/README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/docker/README.md
          git commit -m 'Link Docker extension development guide'
          git push origin HEAD:docs/docker-extension-hot-reload
