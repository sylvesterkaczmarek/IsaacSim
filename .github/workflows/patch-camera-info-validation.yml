name: Patch camera info validation
on:
  push:
    branches:
      - fix/ros2-camera-info-render-product-validation
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ros2-camera-info-render-product-validation
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('source/extensions/isaacsim.ros2.nodes/python/nodes/OgnROS2CameraInfoHelper.py')
          text = path.read_text()

          old = '''        stage = omni.usd.get_context().get_stage()\n        use_srtx = carb.settings.get_settings().get_as_bool(USE_SRTX_SETTING)\n'''
          new = '''        stage = omni.usd.get_context().get_stage()\n        if stage is None:\n            carb.log_warn("USD stage is not available yet, retrying on next call")\n            return False\n\n        use_srtx = carb.settings.get_settings().get_as_bool(USE_SRTX_SETTING)\n'''
          assert text.count(old) == 1, 'stage lookup anchor changed'
          text = text.replace(old, new, 1)

          old = '''            if stage.GetPrimAtPath(render_product_path) is None:\n                carb.log_warn(f"Render product '{render_product_path}' not created yet, retrying on next call")\n                return False\n'''
          new = '''            render_product_prim = stage.GetPrimAtPath(render_product_path)\n            if not render_product_prim or not render_product_prim.IsValid():\n                carb.log_warn(f"Render product '{render_product_path}' not created yet, retrying on next call")\n                return False\n'''
          assert text.count(old) == 1, 'left render product anchor changed'
          text = text.replace(old, new, 1)

          old = '''                if stage.GetPrimAtPath(render_product_path_right) is None:\n                    carb.log_warn(\n                        f"Render product '{render_product_path_right}' not created yet, retrying on next call"\n                    )\n                    return False\n'''
          new = '''                render_product_prim_right = stage.GetPrimAtPath(render_product_path_right)\n                if not render_product_prim_right or not render_product_prim_right.IsValid():\n                    carb.log_warn(\n                        f"Render product '{render_product_path_right}' not created yet, retrying on next call"\n                    )\n                    return False\n'''
          assert text.count(old) == 1, 'right render product anchor changed'
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('source/extensions/isaacsim.ros2.nodes/python/tests/test_camera_info_helper_validation.py')
          test_path.write_text('''# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\n# SPDX-License-Identifier: Apache-2.0\n\n"""Validation tests for ROS2CameraInfoHelper prerequisites."""\n\nimport importlib.util\nfrom pathlib import Path\nfrom unittest.mock import MagicMock, patch\n\nimport omni.kit.test\nfrom pxr import Usd\n\nMODULE_PATH = Path(__file__).resolve().parents[1] / "nodes" / "OgnROS2CameraInfoHelper.py"\nSPEC = importlib.util.spec_from_file_location("_camera_info_helper_validation", MODULE_PATH)\nMODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)\nOgnROS2CameraInfoHelper = MODULE.OgnROS2CameraInfoHelper\n\n\nclass TestROS2CameraInfoHelperValidation(omni.kit.test.AsyncTestCase):\n    """Verify missing stage/render products are handled as retryable prerequisites."""\n\n    @staticmethod\n    def _db() -> MagicMock:\n        db = MagicMock()\n        db.inputs.enabled = True\n        db.inputs.renderProductPath = "/Render/Left"\n        db.inputs.renderProductPathRight = ""\n        db.per_instance_state.initialized = False\n        return db\n\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_missing_stage_returns_false(self, mock_get_context: MagicMock) -> None:\n        db = self._db()\n        mock_get_context.return_value.get_stage.return_value = None\n\n        self.assertFalse(OgnROS2CameraInfoHelper.compute(db))\n\n    @patch.object(MODULE, "read_camera_info")\n    @patch.object(MODULE.carb.settings, "get_settings")\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_missing_left_render_product_retries_before_camera_info(\n        self, mock_get_context: MagicMock, mock_get_settings: MagicMock, mock_read_camera_info: MagicMock\n    ) -> None:\n        db = self._db()\n        stage = Usd.Stage.CreateInMemory()\n        mock_get_context.return_value.get_stage.return_value = stage\n        mock_get_settings.return_value.get_as_bool.return_value = False\n\n        self.assertFalse(OgnROS2CameraInfoHelper.compute(db))\n        mock_read_camera_info.assert_not_called()\n\n    @patch.object(MODULE, "read_camera_info")\n    @patch.object(MODULE.carb.settings, "get_settings")\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_missing_right_render_product_retries_before_camera_info(\n        self, mock_get_context: MagicMock, mock_get_settings: MagicMock, mock_read_camera_info: MagicMock\n    ) -> None:\n        db = self._db()\n        db.inputs.renderProductPathRight = "/Render/Right"\n        stage = Usd.Stage.CreateInMemory()\n        stage.DefinePrim("/Render/Left")\n        mock_get_context.return_value.get_stage.return_value = stage\n        mock_get_settings.return_value.get_as_bool.return_value = False\n\n        self.assertFalse(OgnROS2CameraInfoHelper.compute(db))\n        mock_read_camera_info.assert_not_called()\n''')
      - name: Validate patch
        run: |
          python -m py_compile source/extensions/isaacsim.ros2.nodes/python/nodes/OgnROS2CameraInfoHelper.py source/extensions/isaacsim.ros2.nodes/python/tests/test_camera_info_helper_validation.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/extensions/isaacsim.ros2.nodes/python/nodes/OgnROS2CameraInfoHelper.py source/extensions/isaacsim.ros2.nodes/python/tests/test_camera_info_helper_validation.py
          git diff --cached --quiet || git commit -m "Validate ROS2 camera info render products"
          git push origin HEAD:fix/ros2-camera-info-render-product-validation
