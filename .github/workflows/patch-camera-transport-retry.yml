name: Patch camera transport retry
on:
  push:
    branches:
      - fix/camera-transport-retry-init
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/camera-transport-retry-init
      - name: Apply focused patches
        shell: python
        run: |
          from pathlib import Path

          ucx = Path('source/extensions/isaacsim.ucx.nodes/python/nodes/OgnUCXCameraHelper.py')
          text = ucx.read_text()
          old = '''        if db.per_instance_state.initialized is False:\n            db.per_instance_state.initialized = True\n            stage = omni.usd.get_context().get_stage()\n            with Usd.EditContext(stage, stage.GetSessionLayer()):\n'''
          new = '''        if db.per_instance_state.initialized is False:\n            stage = omni.usd.get_context().get_stage()\n            if stage is None:\n                carb.log_warn("USD stage is not available yet, retrying on next call")\n                return False\n            with Usd.EditContext(stage, stage.GetSessionLayer()):\n'''
          assert text.count(old) == 1, 'UCX initialization anchor changed'
          text = text.replace(old, new, 1)

          old = '''                if stage.GetPrimAtPath(render_product_path) is None:\n                    carb.log_warn("Render product not created yet, retrying on next call")\n                    db.per_instance_state.initialized = False\n                    return False\n'''
          new = '''                render_product_prim = stage.GetPrimAtPath(render_product_path)\n                if not render_product_prim or not render_product_prim.IsValid():\n                    carb.log_warn("Render product not created yet, retrying on next call")\n                    return False\n'''
          assert text.count(old) == 1, 'UCX render product anchor changed'
          text = text.replace(old, new, 1)

          old = '''                    writer = rep.writers.get(db.per_instance_state.rv + f"UCX{time_type}PublishImage")\n                    writer.initialize(\n                        port=db.inputs.port,\n                        tag=db.inputs.tag,\n                        sendCudaBuffer=bool(db.inputs.sendCudaBuffer),\n                    )\n\n                    if writer is not None:\n                        db.per_instance_state.append_writer(writer)\n\n                    db.per_instance_state.attach_writers(render_product_path)\n                except Exception:\n                    print(traceback.format_exc())\n                    return False\n\n        db.outputs.execOut = og.ExecutionAttributeState.ENABLED\n'''
          new = '''                    writer = rep.writers.get(db.per_instance_state.rv + f"UCX{time_type}PublishImage")\n                    if writer is None:\n                        carb.log_error("UCX camera image writer was not found")\n                        return False\n                    writer.initialize(\n                        port=db.inputs.port,\n                        tag=db.inputs.tag,\n                        sendCudaBuffer=bool(db.inputs.sendCudaBuffer),\n                    )\n                    db.per_instance_state.append_writer(writer)\n                    db.per_instance_state.attach_writers(render_product_path)\n                except Exception:\n                    carb.log_error(f"UCXCameraHelper: Failed to setup writer: {traceback.format_exc()}")\n                    return False\n\n                db.per_instance_state.initialized = True\n\n        db.outputs.execOut = og.ExecutionAttributeState.ENABLED\n'''
          assert text.count(old) == 1, 'UCX writer anchor changed'
          ucx.write_text(text.replace(old, new, 1))

          hsb = Path('source/extensions/isaacsim.hsb.nodes/python/nodes/OgnHSBCameraHelper.py')
          text = hsb.read_text()
          old = '''        if db.per_instance_state.initialized is False:\n            db.per_instance_state.initialized = True\n            stage = omni.usd.get_context().get_stage()\n            with Usd.EditContext(stage, stage.GetSessionLayer()):\n'''
          new = '''        if db.per_instance_state.initialized is False:\n            stage = omni.usd.get_context().get_stage()\n            if stage is None:\n                carb.log_warn("USD stage is not available yet, retrying on next call")\n                return False\n            with Usd.EditContext(stage, stage.GetSessionLayer()):\n'''
          assert text.count(old) == 1, 'HSB initialization anchor changed'
          text = text.replace(old, new, 1)

          old = '''                except Exception as e:\n                    carb.log_error(f"HSBCameraHelper: Failed to setup writer: {e}")\n                    print(traceback.format_exc())\n                    return False\n\n        db.outputs.execOut = og.ExecutionAttributeState.ENABLED\n'''
          new = '''                except Exception as e:\n                    carb.log_error(f"HSBCameraHelper: Failed to setup writer: {e}")\n                    print(traceback.format_exc())\n                    return False\n\n                db.per_instance_state.initialized = True\n\n        db.outputs.execOut = og.ExecutionAttributeState.ENABLED\n'''
          assert text.count(old) == 1, 'HSB success anchor changed'
          hsb.write_text(text.replace(old, new, 1))

          ucx_test = Path('source/extensions/isaacsim.ucx.nodes/python/tests/test_camera_helper_validation.py')
          ucx_test.write_text('''# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\n# SPDX-License-Identifier: Apache-2.0\n\n"""Retry-state tests for UCXCameraHelper."""\n\nimport importlib.util\nfrom pathlib import Path\nfrom unittest.mock import MagicMock, patch\n\nimport omni.kit.test\nfrom pxr import Usd\n\nMODULE_PATH = Path(__file__).resolve().parents[1] / "nodes" / "OgnUCXCameraHelper.py"\nSPEC = importlib.util.spec_from_file_location("_ucx_camera_helper_validation", MODULE_PATH)\nMODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)\nOgnUCXCameraHelper = MODULE.OgnUCXCameraHelper\n\n\nclass TestUCXCameraHelperValidation(omni.kit.test.AsyncTestCase):\n    """Verify transient setup failures leave the helper retryable."""\n\n    @staticmethod\n    def _db() -> MagicMock:\n        db = MagicMock()\n        db.per_instance_state.initialized = False\n        db.inputs.renderProductPath = "/Render/Product"\n        db.inputs.resetSimulationTimeOnStop = True\n        db.inputs.frameSkipCount = 0\n        db.inputs.useSystemTime = False\n        db.inputs.port = 13337\n        db.inputs.tag = 10\n        db.inputs.sendCudaBuffer = True\n        return db\n\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_missing_stage_leaves_state_uninitialized(self, mock_get_context: MagicMock) -> None:\n        db = self._db()\n        mock_get_context.return_value.get_stage.return_value = None\n\n        self.assertFalse(OgnUCXCameraHelper.compute(db))\n        self.assertFalse(db.per_instance_state.initialized)\n\n    @patch.object(MODULE.rep.writers, "get", side_effect=RuntimeError("temporary writer failure"))\n    @patch.object(MODULE.omni.syntheticdata.SyntheticData, "convert_sensor_type_to_rendervar", return_value="LdrColor")\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_writer_failure_leaves_state_uninitialized(\n        self, mock_get_context: MagicMock, _mock_convert: MagicMock, _mock_writer_get: MagicMock\n    ) -> None:\n        db = self._db()\n        stage = Usd.Stage.CreateInMemory()\n        stage.DefinePrim("/Render/Product")\n        mock_get_context.return_value.get_stage.return_value = stage\n\n        self.assertFalse(OgnUCXCameraHelper.compute(db))\n        self.assertFalse(db.per_instance_state.initialized)\n''')

          hsb_test = Path('source/extensions/isaacsim.hsb.nodes/python/tests/test_camera_helper_validation.py')
          hsb_test.write_text('''# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\n# SPDX-License-Identifier: Apache-2.0\n\n"""Retry-state tests for HSBCameraHelper."""\n\nimport importlib.util\nfrom pathlib import Path\nfrom unittest.mock import MagicMock, patch\n\nimport omni.kit.test\nfrom pxr import Usd\n\nMODULE_PATH = Path(__file__).resolve().parents[1] / "nodes" / "OgnHSBCameraHelper.py"\nSPEC = importlib.util.spec_from_file_location("_hsb_camera_helper_validation", MODULE_PATH)\nMODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)\nOgnHSBCameraHelper = MODULE.OgnHSBCameraHelper\n\n\nclass TestHSBCameraHelperValidation(omni.kit.test.AsyncTestCase):\n    """Verify transient setup failures leave the helper retryable."""\n\n    @staticmethod\n    def _db() -> MagicMock:\n        db = MagicMock()\n        db.per_instance_state.initialized = False\n        db.inputs.renderProductPath = "/Render/Product"\n        db.inputs.resetSimulationTimeOnStop = True\n        db.inputs.useSystemTime = False\n        db.inputs.type = "vb1940_csi_linux"\n        db.inputs.ipAddress = "127.0.0.1"\n        db.inputs.dataPlaneType = 0\n        db.inputs.dataPlaneId = 0\n        db.inputs.sensorId = 0\n        return db\n\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_missing_stage_leaves_state_uninitialized(self, mock_get_context: MagicMock) -> None:\n        db = self._db()\n        mock_get_context.return_value.get_stage.return_value = None\n\n        self.assertFalse(OgnHSBCameraHelper.compute(db))\n        self.assertFalse(db.per_instance_state.initialized)\n\n    @patch.object(MODULE.rep.writers, "get", side_effect=RuntimeError("temporary writer failure"))\n    @patch.object(MODULE.omni.syntheticdata.SyntheticData, "convert_sensor_type_to_rendervar", return_value="LdrColor")\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_writer_failure_leaves_state_uninitialized(\n        self, mock_get_context: MagicMock, _mock_convert: MagicMock, _mock_writer_get: MagicMock\n    ) -> None:\n        db = self._db()\n        stage = Usd.Stage.CreateInMemory()\n        stage.DefinePrim("/Render/Product")\n        mock_get_context.return_value.get_stage.return_value = stage\n\n        self.assertFalse(OgnHSBCameraHelper.compute(db))\n        self.assertFalse(db.per_instance_state.initialized)\n''')
      - name: Validate patch
        run: |
          python -m py_compile source/extensions/isaacsim.ucx.nodes/python/nodes/OgnUCXCameraHelper.py source/extensions/isaacsim.hsb.nodes/python/nodes/OgnHSBCameraHelper.py source/extensions/isaacsim.ucx.nodes/python/tests/test_camera_helper_validation.py source/extensions/isaacsim.hsb.nodes/python/tests/test_camera_helper_validation.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/extensions/isaacsim.ucx.nodes/python/nodes/OgnUCXCameraHelper.py source/extensions/isaacsim.hsb.nodes/python/nodes/OgnHSBCameraHelper.py source/extensions/isaacsim.ucx.nodes/python/tests/test_camera_helper_validation.py source/extensions/isaacsim.hsb.nodes/python/tests/test_camera_helper_validation.py
          git diff --cached --quiet || git commit -m "Keep camera transport helpers retryable after setup failures"
          git push origin HEAD:fix/camera-transport-retry-init
