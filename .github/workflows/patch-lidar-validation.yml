name: Patch lidar validation
on:
  push:
    branches:
      - fix/ros2-lidar-render-product-validation
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ros2-lidar-render-product-validation
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('source/extensions/isaacsim.ros2.nodes/python/nodes/OgnROS2RtxLidarHelper.py')
          text = path.read_text()
          old = '''        stage = omni.usd.get_context().get_stage()\n        render_product_path = db.inputs.renderProductPath\n        if not render_product_path:\n            carb.log_warn(f"Render product '{render_product_path}' not valid")\n            return False\n        if stage.GetPrimAtPath(render_product_path) is None:\n            # Invalid Render Product Path\n            carb.log_warn(f"Render product '{render_product_path}' not created yet, retrying on next call")\n            return False\n'''
          new = '''        stage = omni.usd.get_context().get_stage()\n        render_product_path = db.inputs.renderProductPath\n        if not render_product_path:\n            carb.log_warn(f"Render product '{render_product_path}' not valid")\n            return False\n        if stage is None:\n            carb.log_warn("USD stage is not available yet, retrying on next call")\n            return False\n        render_product_prim = stage.GetPrimAtPath(render_product_path)\n        if not render_product_prim or not render_product_prim.IsValid():\n            # Invalid Render Product Path\n            carb.log_warn(f"Render product '{render_product_path}' not created yet, retrying on next call")\n            return False\n'''
          assert text.count(old) == 1, 'lidar validation anchor changed'
          path.write_text(text.replace(old, new, 1))

          test_path = Path('source/extensions/isaacsim.ros2.nodes/python/tests/test_rtx_lidar_helper_validation.py')
          test_path.write_text('''# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.\n# SPDX-License-Identifier: Apache-2.0\n\n"""Validation tests for ROS2RtxLidarHelper prerequisites."""\n\nimport importlib.util\nfrom pathlib import Path\nfrom unittest.mock import MagicMock, patch\n\nimport omni.kit.test\nfrom pxr import Usd\n\nMODULE_PATH = Path(__file__).resolve().parents[1] / "nodes" / "OgnROS2RtxLidarHelper.py"\nSPEC = importlib.util.spec_from_file_location("_rtx_lidar_helper_validation", MODULE_PATH)\nMODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)\nOgnROS2RtxLidarHelper = MODULE.OgnROS2RtxLidarHelper\n\n\nclass TestROS2RtxLidarHelperValidation(omni.kit.test.AsyncTestCase):\n    """Verify missing stage/render products are rejected before camera lookup."""\n\n    @staticmethod\n    def _db() -> MagicMock:\n        db = MagicMock()\n        db.inputs.enabled = True\n        db.inputs.renderProductPath = "/Render/MissingProduct"\n        db.per_instance_state.initialized = False\n        return db\n\n    @patch.object(MODULE.ViewportManager, "get_camera")\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_missing_stage_retries_before_camera_lookup(\n        self, mock_get_context: MagicMock, mock_get_camera: MagicMock\n    ) -> None:\n        db = self._db()\n        mock_get_context.return_value.get_stage.return_value = None\n\n        self.assertFalse(OgnROS2RtxLidarHelper.compute(db))\n        mock_get_camera.assert_not_called()\n\n    @patch.object(MODULE.ViewportManager, "get_camera")\n    @patch.object(MODULE.omni.usd, "get_context")\n    async def test_missing_render_product_retries_before_camera_lookup(\n        self, mock_get_context: MagicMock, mock_get_camera: MagicMock\n    ) -> None:\n        db = self._db()\n        mock_get_context.return_value.get_stage.return_value = Usd.Stage.CreateInMemory()\n\n        self.assertFalse(OgnROS2RtxLidarHelper.compute(db))\n        mock_get_camera.assert_not_called()\n''')
      - name: Validate patch
        run: |
          python -m py_compile source/extensions/isaacsim.ros2.nodes/python/nodes/OgnROS2RtxLidarHelper.py source/extensions/isaacsim.ros2.nodes/python/tests/test_rtx_lidar_helper_validation.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/extensions/isaacsim.ros2.nodes/python/nodes/OgnROS2RtxLidarHelper.py source/extensions/isaacsim.ros2.nodes/python/tests/test_rtx_lidar_helper_validation.py
          git diff --cached --quiet || git commit -m "Validate ROS2 lidar render products"
          git push origin HEAD:fix/ros2-lidar-render-product-validation
