name: Patch SRTX capture retry state
on:
  push:
    branches:
      - fix/srtx-capture-retry-state
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/srtx-capture-retry-state
      - name: Apply focused patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('source/extensions/isaacsim.ros2.nodes/python/impl/ros2_common.py')
          text = path.read_text()
          old = '''        paths = self._output_paths.setdefault(sensor_set_name, [])
        if output_path in paths:
            return
        paths.append(output_path)
        srtx_instance.stop_continuous_capture(sensor_set_name)
        srtx_instance.start_continuous_capture(sensor_set_name, paths)
'''
          new = '''        paths = self._output_paths.setdefault(sensor_set_name, [])
        if output_path in paths:
            return

        updated_paths = [*paths, output_path]
        srtx_instance.stop_continuous_capture(sensor_set_name)
        try:
            srtx_instance.start_continuous_capture(sensor_set_name, updated_paths)
        except Exception:
            if not paths:
                self._output_paths.pop(sensor_set_name, None)
            raise
        self._output_paths[sensor_set_name] = updated_paths
'''
          assert text.count(old) == 1, 'SRTX capture anchor changed'
          path.write_text(text.replace(old, new, 1))

          test_path = Path('source/extensions/isaacsim.ros2.nodes/python/tests/test_srtx_sensor_set_config.py')
          test_text = test_path.read_text()
          marker = '\n\nclass TestConfiguredSrtxSensorSets(omni.kit.test.AsyncTestCase):\n'
          assert test_text.count(marker) == 1, 'test class anchor changed'
          regression = '''

class TestSrtxCaptureRetryState(omni.kit.test.AsyncTestCase):
    """Verify failed continuous-capture starts remain retryable."""

    async def test_failed_start_does_not_cache_output_path(self) -> None:
        """A transient start failure must not make a later retry a no-op."""
        state = ros2_common.SrtxCaptureState()
        state._refresh_stage = lambda: None

        srtx_instance = types.SimpleNamespace()
        srtx_instance.stop_calls = []
        srtx_instance.start_calls = []
        srtx_instance.fail_start = True

        def stop_continuous_capture(sensor_set_name: str) -> None:
            srtx_instance.stop_calls.append(sensor_set_name)

        def start_continuous_capture(sensor_set_name: str, output_paths: list[str]) -> None:
            srtx_instance.start_calls.append((sensor_set_name, list(output_paths)))
            if srtx_instance.fail_start:
                srtx_instance.fail_start = False
                raise RuntimeError("transient SRTX start failure")

        srtx_instance.stop_continuous_capture = stop_continuous_capture
        srtx_instance.start_continuous_capture = start_continuous_capture

        with self.assertRaisesRegex(RuntimeError, "transient SRTX start failure"):
            state.start_or_extend(srtx_instance, "sensor-set", "/Render/Product/LdrColor")

        self.assertNotIn("sensor-set", state._output_paths)

        state.start_or_extend(srtx_instance, "sensor-set", "/Render/Product/LdrColor")

        self.assertEqual(state._output_paths["sensor-set"], ["/Render/Product/LdrColor"])
        self.assertEqual(len(srtx_instance.start_calls), 2)
'''
          test_path.write_text(test_text.replace(marker, regression + marker, 1))
      - name: Validate patch
        run: |
          python -m py_compile source/extensions/isaacsim.ros2.nodes/python/impl/ros2_common.py source/extensions/isaacsim.ros2.nodes/python/tests/test_srtx_sensor_set_config.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/extensions/isaacsim.ros2.nodes/python/impl/ros2_common.py source/extensions/isaacsim.ros2.nodes/python/tests/test_srtx_sensor_set_config.py
          git diff --cached --quiet || git commit -m "Keep SRTX capture state retryable after start failures"
          git push origin HEAD:fix/srtx-capture-retry-state
