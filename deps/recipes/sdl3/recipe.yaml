context:
  version: "3.4.14"

package:
  name: sdl3
  version: ${{ version }}

source:
  url: https://github.com/libsdl-org/SDL/archive/refs/tags/release-${{ version }}.tar.gz
  sha256: 9d57b178fb297e121ef2605275937b7afaa7cd24d99ce1f95953e69e7a2535d6

requirements:
  build:
    - ${{ compiler('c') }}
    - cmake ==4.3.2
    - ninja ==1.13.2
    - python ==3.12.13
  host:
    - if: linux
      then:
        - xorg-libx11 1.8.*
        - xorg-libxcursor 1.2.*
        - xorg-libxext 1.3.*
        - xorg-libxfixes 6.*
        - xorg-libxi 1.8.*
        - xorg-libxrandr 1.5.*
        - xorg-libxscrnsaver 1.2.*
        - xorg-libxtst 1.2.*
        - xorg-xorgproto

build:
  number: 2
  script:
    - if: win
      then: python "%RECIPE_DIR%/build.py"
      else: python "$RECIPE_DIR/build.py"

tests:
  - package_contents:
      include:
        - SDL3/SDL.h
      files:
        - if: linux
          then: share/licenses/SDL3/LICENSE.txt
        - if: win
          then: Library/licenses/SDL3/LICENSE.txt

about:
  homepage: https://www.libsdl.org
  license: Zlib
  license_file: LICENSE.txt
  repository: https://github.com/libsdl-org/SDL
  summary: Cross-platform access to audio, input, and graphics hardware.
