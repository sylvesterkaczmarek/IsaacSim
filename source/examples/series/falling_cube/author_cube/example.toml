id = "falling_cube.author_cube"
title = "Author a Cube"
summary = "Create a stage and author a cube."
owners = ["isaacsim.foundation.objects"]
topics = ["python", "usd"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
system = ["python"]

[[requirements.modules]]
name = "isaacsim_foundation"
surfaces = ["python"]

[[test]]
name = "default"
stdout_contains = ["Authored /World/Cube at (0.0, 0.0, 2.0)."]
