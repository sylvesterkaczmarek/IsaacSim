id = "motion_generation.pick_place"
title = "Motion Generation Pick and Place"
summary = "Drive a Franka pick/place trajectory while OVGL displays the live OvPhysX stage."
owners = [
    "isaacsim.foundation.objects",
    "isaacsim.physics.entities",
    "isaacsim.robot_motion.experimental.motion_generation",
    "isaacsim.physics.manager",
    "isaacsim.physics_engines.ovphysx",
    "isaacsim.ovgl_viewport.debug",
]
topics = ["manipulation", "motion_generation", "physics", "python", "rendering", "viewport"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
system = ["python"]

[[requirements.modules]]
name = "isaacsim_foundation"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_deprecated"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_physics"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_physics_engines"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_robot_motion"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_robot_motion_schema"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_ovgl_viewport"
surfaces = ["python"]

[[test]]
name = "headless"
arguments = ["--headless"]
timeout_seconds = 300
stdout_contains = ["Franka pick/place completed:", "Headless Franka rendering smoke test passed."]
