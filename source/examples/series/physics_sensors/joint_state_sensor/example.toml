id = "physics_sensors.joint_state_sensor"
title = "Joint State Sensor"
summary = "Read the position, velocity, and effort of every degree of freedom of an articulation."
owners = [
    "isaacsim.foundation.objects",
    "isaacsim.foundation.prims",
    "isaacsim.physics.entities",
    "isaacsim.physics.manager",
    "isaacsim.physics_engines.ovphysx",
]
topics = ["articulation", "physics", "python", "robotics", "sensors", "usd"]

[build]
adapter = "none"

[run]
adapter = "python"
path = "main.py"

[requirements]
system = ["python"]

[[requirements.modules]]
name = "isaacsim_foundation"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_physics"
surfaces = ["python"]

[[requirements.modules]]
name = "isaacsim_physics_engines"
surfaces = ["python"]

[[test]]
name = "default"
stdout_contains = [
    "Reporting measured joint effort, not commanded actuation.",
    "DOF names and types match the articulation: lift (translation), spin (rotation).",
    "Readings are stamped with the time their newest sample was taken.",
    "Descending lift velocity matches the drive rate in stage units and in SI units.",
    "Descending lift velocity is the drive rate, in metres per second.",
    "Descending lift acceleration is zero at a constant rate.",
    "Free spin DOF holds its rate in radians per second.",
    "Free spin DOF position advances at its rate.",
    "Free spin DOF measures no effort while the lift beside it carries a load.",
    "Resting lift position matches the joint limit, in metres.",
    "Resting lift effort matches the 3 kg it carries:",
    "Selecting DOFs by name reorders the reading: spin, lift.",
]


[[test]]
name = "self_test"
arguments = ["--self-test"]
stdout_contains = [
    "Self-test: all ",
]
