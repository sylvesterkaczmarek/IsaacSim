[core]
# Load as early as possible so policy extensions can import onnxruntime.
order = -1000
reloadable = false

[package]
version = "1.0.1"
category = "Internal"
title = "ONNX Pip Archive"
description = "Pip packages for ONNX model inference"
keywords = ["isaac", "pip", "onnx", "onnxruntime", "policy"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true
writeTarget.platform = true # pip prebundle makes this extension os specific
writeTarget.python = true

[dependencies]
# CUDA runtime libraries required by the GPU wheel on Linux x86_64
"filter:platform"."linux-x86_64"."isaacsim.pip.nv" = {}
"omni.kit.pip_archive" = {} # import the base kit python archive

[[python.module]]
path = "pip_prebundle"

# Empty module for extension/test discovery.
[[python.module]]
name = "isaacsim.pip.onnx"

[[test]]

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]
