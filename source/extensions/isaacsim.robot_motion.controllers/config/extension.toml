# Extension configuration file.
# Visit the "Extension configuration file (extension.toml)" section for more details:
# https://docs.omniverse.nvidia.com/kit/docs/kit-manual/latest/guide/extensions_advanced.html
#

[package]
version = "0.3.2"
category = "simulation"
title = "controllers"
description = "Contains portable controllers which can be used in Isaac Sim."
keywords = ["ackermann", "controllers", "differential", "generation", "holonomic", "impedance", "joint", "motion", "operational"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"isaacsim.common" = {}
"isaacsim.core.experimental.utils" = {}
"isaacsim.pip.newton" = {}
"isaacsim.robot_motion.experimental.motion_generation" = {}

[[python.module]]
name = "isaacsim.robot_motion.controllers"

# define the Python module for tests
[[python.module]]
name = "isaacsim.robot_motion.controllers.tests"

# test dependencies
[[test]]
dependencies = [
    "isaacsim.robot.experimental.wheeled_robots",
    "isaacsim.storage.native",
]

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
