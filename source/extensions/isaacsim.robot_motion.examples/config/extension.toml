[package]
version = "0.2.6"
category = "example"
title = "Robot Motion Examples"
description = "Robot-independent motion generation examples for manipulators and future robot categories."
keywords = ["robot", "motion", "manipulation", "examples", "rmpflow"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true
writeTarget.python = true

[dependencies]
"isaacsim.asset.gen.conveyor" = {}
"isaacsim.core.experimental.materials" = {}
"isaacsim.core.experimental.objects" = {}
"isaacsim.core.experimental.prims" = {}
"isaacsim.core.experimental.utils" = {}
"isaacsim.core.rendering_manager" = {}
"isaacsim.core.simulation_manager" = {}
"isaacsim.examples.base" = {}
"isaacsim.examples.browser" = {}
"isaacsim.gui.components" = {}
"isaacsim.robot.surface_gripper" = {}
"isaacsim.robot_motion.cumotion" = {}
"isaacsim.robot_motion.experimental.motion_generation" = {}
"isaacsim.robot_motion.schema" = {}
"isaacsim.storage.native" = {}
"omni.behavior.tree.core" = {}
"omni.isaac.core_archive" = {}
"omni.kit.uiapp" = {}
"omni.physx" = {}
"omni.pip.compute" = {}

[[python.module]]
name = "isaacsim.robot_motion.examples"

[[python.module]]
name = "isaacsim.robot_motion.examples.manipulation.interactive.bin_filling"

[[python.module]]
name = "isaacsim.robot_motion.examples.manipulation.interactive.follow_target_motion_generation"

[[python.module]]
name = "isaacsim.robot_motion.examples.manipulation.interactive.follow_target_ur10"

[[python.module]]
name = "isaacsim.robot_motion.examples.manipulation.interactive.palletizing"

[[python.module]]
name = "isaacsim.robot_motion.examples.manipulation.interactive.pick_place"

[[python.module]]
name = "isaacsim.robot_motion.examples.manipulation.interactive.replay_follow_target"

[[python.module]]
name = "isaacsim.robot_motion.examples.manipulation.interactive.robo_factory"

[[python.module]]
name = "isaacsim.robot_motion.examples.tests"

[fswatcher.patterns]
include = ["*.py"]

[[test]]
name = "startup"
args = [
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
]

stdoutFailPatterns.exclude = ["*The NumPy module was reloaded*"]

[[test]]
timeout = 900
args = [
    "--enable",
    "omni.kit.loop-isaac",
    "--reset-user",
    "--vulkan",
    "--/app/asyncRendering=0",
    "--/app/asyncRenderingLowLatency=0",
    "--/app/fastShutdown=1",
    "--/app/file/ignoreUnsavedStage=1",
    "--/app/hydraEngine/waitIdle=0",
    "--/app/player/useFixedTimeStepping=false",
    "--/app/renderer/skipWhileMinimized=0",
    "--/app/renderer/sleepMsOnFocus=0",
    "--/app/renderer/sleepMsOutOfFocus=0",
    "--/app/runLoops/main/manualModeEnabled=true",
    "--/app/runLoops/main/rateLimitEnabled=false",
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
    "--/app/settings/persistent=0",
    "--/app/useFabricSceneDelegate=true",
    "--/app/viewport/createCameraModelRep=0",
    "--/crashreporter/skipOldDumpUpload=1",
    "--/exts/omni.usd/locking/onClose=0",
    "--/omni/kit/plugin/syncUsdLoads=1",
    "--/omni/replicator/asyncRendering=0",
    "--/omnihydra/parallelHydraSprimSync=1",
    '--/persistent/app/stage/upAxis="Z"',
    "--/persistent/app/viewport/defaults/tickRate=120",
    "--/persistent/app/viewport/displayOptions=31951",
    "--/persistent/omni/replicator/captureOnPlay=1",
    "--/persistent/omnigraph/updateToUsd=0",
    "--/persistent/physics/visualizationDisplayJoints=0",
    "--/persistent/renderer/startupMessageDisplayed=1",
    "--/persistent/simulation/defaultMetersPerUnit=1.0",
    "--/persistent/simulation/minFrameRate=15",
    "--/renderer/multiGpu/autoEnable=0",
    "--/renderer/multiGpu/enabled=0",
    "--/rtx-transient/dlssg/enabled=0",
    "--/rtx-transient/resourcemanager/enableTextureStreaming=1",
    "--/rtx/descriptorSets=360000",
    "--/rtx/hydra/enableSemanticSchema=1",
    "--/rtx/hydra/materialSyncLoads=1",
    "--/rtx/hydra/supportMultiTickRate=true",
    "--/rtx/materialDb/syncLoads=1",
    "--/rtx/newDenoiser/enabled=1",
    "--/rtx/rendering/perSensorTickTlas=true",
    "--/rtx/reservedDescriptors=900000",
]

stdoutFailPatterns.exclude = ["*The NumPy module was reloaded*"]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
