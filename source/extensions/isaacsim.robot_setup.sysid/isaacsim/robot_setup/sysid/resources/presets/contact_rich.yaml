name: contact_rich
description: General contact-heavy identification for probes, grippers, and manipulation fixtures.
include_basic: true
include_com_offsets: true
include_inertia_log_cholesky: false
include_joint_limit_scales: true
optimizer_backend:
  backend: cma_es
  cma_sigma: 0.3
residual_weights:
  position_weight: 0.8
  velocity_weight: 0.3
  torque_weight: 0.2
  end_effector_pose_weight: 0.2
  contact_force_weight: 1.2
recommended_scenes:
  - data/scenes/contact_probing.usda
  - data/scenes/benchtop_force.usda
notes:
  - Verify collision geometry against the measured hardware before collecting contact-rich data.
  - Weight force residuals only after the signal frame and sign convention are verified.
