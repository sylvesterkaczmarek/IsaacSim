name: dexterous_hand
description: High-DOF hand calibration focused on drive gains, limits, and contact behavior.
include_basic: true
include_com_offsets: false
include_inertia_log_cholesky: false
include_joint_limit_scales: true
optimizer_backend:
  backend: cma_es
  cma_sigma: 0.2
  cma_population_size: 32
residual_weights:
  position_weight: 1.0
  velocity_weight: 0.4
  torque_weight: 0.1
  end_effector_pose_weight: 0.0
  contact_force_weight: 1.0
recommended_scenes:
  - data/scenes/contact_probing.usda
  - data/scenes/benchtop_force.usda
notes:
  - Calibrate finger groups in stages when the full hand is too high-dimensional.
  - Use benchtop force data for fingertip normal-force targets.
