name: manipulator
description: Free-space arm identification with rigid-body and joint-drive parameters.
include_basic: true
include_com_offsets: true
include_inertia_log_cholesky: true
include_joint_limit_scales: true
optimizer_backend:
  backend: levenberg_marquardt
  use_analytical_jacobian: true
residual_weights:
  position_weight: 1.0
  velocity_weight: 0.5
  torque_weight: 0.2
  end_effector_pose_weight: 0.5
  contact_force_weight: 0.0
recommended_scenes:
  - data/scenes/free_space.usda
  - data/scenes/gravity_comp.usda
notes:
  - Use excitation trajectories that avoid joint limits for the first pass.
  - Enable end-effector residuals when external tracking is available.
