name: quadruped
description: Legged robot identification with joint-drive, mass, COM, and contact-force residuals.
include_basic: true
include_com_offsets: true
include_inertia_log_cholesky: false
include_joint_limit_scales: true
optimizer_backend:
  backend: cma_es
  cma_sigma: 0.25
residual_weights:
  position_weight: 1.0
  velocity_weight: 0.5
  torque_weight: 0.2
  end_effector_pose_weight: 0.0
  contact_force_weight: 0.8
recommended_scenes:
  - data/scenes/contact_probing.usda
  - data/scenes/gravity_comp.usda
notes:
  - Start with damping and friction before expanding to inertia terms.
  - Prefer CMA-ES when contact force residuals dominate.
