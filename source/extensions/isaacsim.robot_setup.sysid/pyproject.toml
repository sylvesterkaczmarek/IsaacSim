[project]
name = "isaacsim-robot-setup-sysid"
version = "2.1.0"
description = "System identification contracts, optimizers, and headless runtimes for robot simulation"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "PyYAML",
    "torch",
]
readme = "docs/Overview.md"
license = "Apache-2.0"
keywords = ["nvidia", "isaac", "simulation", "robotics", "system-identification"]
authors = [{name = "NVIDIA Corporation"}]

[project.optional-dependencies]
newton = [
    # Keep this coupled set aligned with isaacsim.pip.newton.  Mixing Newton,
    # the USD schemas, and MuJoCo-Warp from different releases can import
    # successfully and still fail when a model or actuator is constructed.
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "newton-usd-schemas==0.4.1",
    "newton[sim]==1.5.0",
    "usd-core>=24.0",
    "warp-lang>=1.16.0",
]
telemetry = [
    "mcap==1.3.0",
    "rosbags==0.11.0",
]
reports = ["matplotlib"]
all = [
    "matplotlib",
    "mcap==1.3.0",
    "mujoco==3.11.0",
    "mujoco-warp==3.11.0",
    "newton-usd-schemas==0.4.1",
    "newton[sim]==1.5.0",
    "rosbags==0.11.0",
    "usd-core>=24.0",
    "warp-lang>=1.16.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["isaacsim.robot_setup.sysid", "isaacsim.robot_setup.sysid.*"]
exclude = ["isaacsim.robot_setup.sysid.tests", "isaacsim.robot_setup.sysid.tests.*", "isaacsim.robot_setup.sysid.ui", "isaacsim.robot_setup.sysid.ui.*"]

[tool.setuptools.package-data]
"isaacsim.robot_setup.sysid" = [
    "resources/config/*.json",
    "resources/config/*.yaml",
    "resources/presets/*.yaml",
    "resources/presets/*.yml",
    "resources/schemas/*.json",
    "resources/schemas/*.usda",
]
