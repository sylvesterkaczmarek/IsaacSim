[package]
version = "1.0.0"
category = "Simulation"
title = "Virtual Gantry UI"
description = "UI components for the Virtual Gantry extension: Create menu, property panel and hotkeys."
keywords = ["isaac", "gantry", "suspend", "bringup", "robot", "ui"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true

[dependencies]
"isaacsim.gui.menu" = {}
"isaacsim.robot_setup.virtual_gantry" = {}
"isaacsim.robot_setup.virtual_gantry_schema" = {}
"omni.kit.actions.core" = {}
"omni.kit.menu.utils" = {}
"omni.kit.property.usd" = {}
"omni.kit.window.property" = {}
"omni.ui" = {}
"omni.usd" = {}

[[python.module]]
name = "isaacsim.robot_setup.virtual_gantry.ui"

[[test]]
name = "startup"

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
