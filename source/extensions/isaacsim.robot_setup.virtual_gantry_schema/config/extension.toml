[core]
reloadable = false
# Load at the start, load all schemas with order -100 (with order -1000 the USD libs are loaded)
order = -100

[package]
version = "1.0.1"
category = "Simulation"
title = "Isaac Sim Virtual Gantry Schema"
description = "Extension that provides the USD schema for the Isaac Virtual Gantry."
keywords = ["isaac", "gantry", "schema", "usd"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true

[dependencies]
"omni.usd" = {}
"omni.usd.libs" = {}

[[python.module]]
path = "pip_prebundle"

[[python.module]]
name = "isaacsim.robot_setup.virtual_gantry_schema"

[[test]]
name = "startup"

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
