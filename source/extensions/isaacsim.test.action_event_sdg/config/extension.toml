[package]
version = "1.0.1"
category = "Internal"
title = "Isaac Sim Action and Event Data Generation Tests"
description = "Downstream integration tests for the Action and Event Data Generation (Isaac Sim Replicator Agent) extensions consumed from the extension registry"
keywords = ["isaac", "tests", "sdg", "replicator", "agent"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
icon = "data/icon.png"
writeTarget.kit = true

[dependencies]
"isaacsim.replicator.agent.core" = {}
"omni.metropolis.utils" = {}
"omni.usd" = {}

[[python.module]]
name = "isaacsim.test.action_event_sdg"

[[python.module]]
name = "isaacsim.test.action_event_sdg.tests"

[[test]]
name = "startup"
dependencies = [
    "omni.isaac.ml_archive",
]
args = [
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
]

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
]

[[test]]
timeout = 1800
dependencies = [
    "omni.isaac.ml_archive",
]
args = [
    "--enable",
    "omni.kit.loop-isaac",
    "--reset-user",
    "--vulkan",
    "--/app/asyncRendering=0",
    "--/app/asyncRenderingLowLatency=0",
    "--/app/fastShutdown=1",
    "--/app/file/ignoreUnsavedStage=1",
    "--/app/hydraEngine/waitIdle=0",
    "--/app/player/useFixedTimeStepping=false",
    "--/app/renderer/skipWhileMinimized=0",
    "--/app/renderer/sleepMsOnFocus=0",
    "--/app/renderer/sleepMsOutOfFocus=0",
    "--/app/runLoops/main/manualModeEnabled=true",
    "--/app/runLoops/main/rateLimitEnabled=false",
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
    "--/app/settings/persistent=0",
    "--/app/useFabricSceneDelegate=true",
    "--/app/viewport/createCameraModelRep=0",
    "--/crashreporter/skipOldDumpUpload=1",
    "--/exts/omni.usd/locking/onClose=0",
    "--/omni/kit/plugin/syncUsdLoads=1",
    "--/omni/replicator/asyncRendering=0",
    "--/omnihydra/parallelHydraSprimSync=1",
    '--/persistent/app/stage/upAxis="Z"',
    "--/persistent/app/viewport/defaults/tickRate=120",
    "--/persistent/app/viewport/displayOptions=31951",
    "--/persistent/omni/replicator/captureOnPlay=1",
    "--/persistent/omnigraph/updateToUsd=0",
    "--/persistent/physics/visualizationDisplayJoints=0",
    "--/persistent/renderer/startupMessageDisplayed=1",
    "--/persistent/simulation/defaultMetersPerUnit=1.0",
    "--/persistent/simulation/minFrameRate=15",
    "--/renderer/multiGpu/autoEnable=0",
    "--/renderer/multiGpu/enabled=0",
    "--/rtx-transient/dlssg/enabled=0",
    "--/rtx-transient/resourcemanager/enableTextureStreaming=1",
    "--/rtx/descriptorSets=360000",
    "--/rtx/hydra/enableSemanticSchema=1",
    "--/rtx/hydra/materialSyncLoads=1",
    "--/rtx/hydra/supportMultiTickRate=true",
    "--/rtx/materialDb/syncLoads=1",
    "--/rtx/newDenoiser/enabled=1",
    "--/rtx/rendering/perSensorTickTlas=true",
    "--/rtx/reservedDescriptors=900000",
    ### Extension specific args
    "--no-window",
    "--/windowless=1",
    "--/exts/omni.kit.test/testExtDefaultTimeout=1200",
    "--/exts/omni.anim.navigation.core/navMesh/config/autoRebakeOnChanges=0",
    "--/exts/omni.anim.navigation.core/navMesh/config/vizGeomEnable=0",
    "--/exts/omni.anim.navigation.core/navMesh/config/vizSurfaceEnable=0",
    "--/exts/omni.anim.navigation.core/navMesh/config/vizOutlineEnable=0",
    "--/exts/omni.anim.navigation.core/navMesh/config/viewNavMesh=0",
    "--/persistent.exts/omni.anim.navigation.core/navMesh/config/autoRebakeOnChanges=0",
    "--/persistent.exts/omni.anim.navigation.core/navMesh/config/vizGeomEnable=0",
    "--/persistent.exts/omni.anim.navigation.core/navMesh/config/vizSurfaceEnable=0",
    "--/persistent.exts/omni.anim.navigation.core/navMesh/config/vizOutlineEnable=0",
    "--/persistent.exts/omni.anim.navigation.core/navMesh/config/viewNavMesh=0",
    "--/persistent/isaac/asset_root/timeout=0.1",
]

stdoutFailPatterns.exclude = [
    '*The NumPy module was reloaded*',
    ### test-suite specific args
    "*FutureWarning: `torch.distributed.reduce_op` is deprecated, please use `torch.distributed.ReduceOp` instead*",
    "*GLInteropContext::init: carb::windowing is not available*",
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]
