# ros2_control YAML for the UR10 in-process Controller Manager demo.
# This file is the same shape you'd use against a real UR10; the only thing
# Isaac-Sim-specific is the IsaacSimSystem hardware-interface plugin name
# (referenced in the synthesized URDF, not here).
controller_manager:
  ros__parameters:
    update_rate: 100   # Hz; matches the UR10 demo's typical physics step rate.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    scaled_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0
